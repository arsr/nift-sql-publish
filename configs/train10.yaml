# Appendix, training size: same as default.yaml, but trains on 10% of all questions (0.2 of the 50% train part).
# Validation (30%) and test (20%) are identical to the headline runs.
# Do not edit this file for an experiment run. Change only SEED and RUN_NAME in the notebook.
# Any change to this file is a new method and needs agreement first (see README, "Changing the method").

datasets:            # public benchmarks only, schema only (names, columns, joins). No data rows.
  beaver: beaver
  livesqlbench: livesqlbench_table
  livesqlbench_large: livesqlbench_large_table

customers:           # one scorer + one fusion per customer. The two LiveSQLBench sets share databases and questions,
  beaver: [beaver]   # so they are one customer and are split together (same question text = same side).
  livesqlbench: [livesqlbench, livesqlbench_large]

split:
  train: 0.5         # by question count, grouped by gold-table set
  val: 0.3
  test: 0.2
  train_use: 0.2     # share of the TRAIN part actually used; < 1 only for the training-size appendix

card:
  mode: names_only   # "TABLE: col, col, ..." from CREATE TABLE. Types, comments and sample rows are ignored.
  joins_max: 6
  card_max: 700

search:
  model: BAAI/bge-large-en-v1.5
  w_dense: 0.6
  w_bm25: 0.4

scorer:
  base: convaiinnovations/laya
  laya_version: 0.4.8
  hard_neg: 4
  rand_neg: 1
  epochs: 4
  loss: soft-ce
  micro_batch: 16
  grad_accum: 4
  calib_max: 2000
  batch_size: 128    # scoring batch size

fusion:
  candidates_top: 50 # Laya top 50 union search top 50
  C: 1.0
  features: [logit_p, log_rank_cls, log_rank_hyb, dense, bm25, disagree, db_best_rank_hyb, db_best_rank_cls]

evaluate:
  K: [5, 8, 15, 25]
  N: [5, 10, 15]
  headline: [c@8, c@15]
  bootstrap_reps: 3000

costs:
  gpu_price_per_hour: 1.50
